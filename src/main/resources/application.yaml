spring:
  application:
    name: iris
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - public_profile
              - email
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  auth:
    refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
    oauth-success-url: ${OAUTH_SUCCESS_URL:/}
    oauth-failure-url: ${OAUTH_FAILURE_URL:/login?error=oauth}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    max-age: 3600
  cookie:
    device:
      secure: true
      http-only: true
      domain: localhost
      path: /
      same-site: Lax
      max-age: 31536000
    jwt:
      secure: true
      http-only: true
      domain: localhost
      path: /
      same-site: Lax
    refresh:
      secure: true
      http-only: true
      domain: localhost
      path: /
      same-site: Lax

security:
  hash:
    bcrypt:
      strength: ${BCRYPT_STRENGTH:10}
    hmac:
      sha-secret: ${HMAC_SHA_SECRET}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
